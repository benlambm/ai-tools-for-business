project:
  type: book
  output-dir: _book

book:
  title: "AI Tools for Business and Information Technology"
  subtitle: "An Open Textbook for ITE 142 - Public Beta"
  author: "Benjamin Lamb, PhD"
  date: "2026-05-25"
  repo-url: "https://github.com/benlambm/ai-tools-for-business"
  repo-actions: [edit, issue]
  downloads: [pdf, epub]
  page-footer:
    left: "AI Tools for Business and Information Technology - Public Beta"
    right: "Licensed CC BY 4.0"
  chapters:
    - index.qmd
    - 01-customer-service.qmd
    - 02-data-analytics.qmd
    - 03-digital-marketing.qmd
    - 04-fraud-security.qmd
    - 05-supply-chain.qmd
    - 06-human-resources.qmd
    - 07-financial-forecasting.qmd
    - 08-business-process-automation.qmd
    - 09-product-design.qmd
  appendices:
    - appendix-ai-assisted-workflow.qmd

license: "CC BY 4.0"

format:
  html:
    theme: cosmo
    toc: true
    number-sections: false
    code-copy: true
    link-external-newwindow: true
    callout-appearance: simple
  typst:
    toc: true
    number-sections: false
    filters:
      - filters/typst-chapter-titles.lua
  epub:
    toc: true
    number-sections: false

execute:
  freeze: auto
