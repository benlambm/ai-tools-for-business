- slug: what-ai-is-good-at-in
  prompt: 'Editorial textbook illustration for the section ''What AI is good at in finance
    planning''. Represent this idea visually: AI tools are strongest when the task has clear
    data, repeated patterns, and a need for speed. They are good at finding patterns across
    many rows of historical data. They can spot recurring seasonality, unusual spikes, delayed
    payments, expense categories that are growing quickly, or departments that consistently
    over-budget or under-budget. Use simplified people, business objects, workflow arrows,
    abstract screens, and symbolic data shapes only.'
  alt: Illustration of What AI is good at in finance planning using abstract business and
    technology symbols.
  caption: What AI is good at in finance planning is a practical part of AI use in business
    and IT.
  aspect: '4:3'
  anchor_heading: 5. What AI is good at in finance planning
  placement: after-first-paragraph
- slug: how-the-finance-job-changes
  prompt: 'Editorial textbook illustration for the section ''How the finance job changes''.
    Represent this idea visually: AI does not remove the need for finance professionals. It
    changes what good finance work looks like. A traditional junior analyst might spend much
    of the week downloading data, fixing spreadsheet formats, updating formulas, checking
    totals, and preparing slides. With AI-enabled tools, some of that work can be automated
    or accelerated. Use simplified people, business objects, workflow arrows, abstract screens,
    and symbolic data shapes only.'
  alt: Illustration of How the finance job changes using abstract business and technology
    symbols.
  caption: How the finance job changes is a practical part of AI use in business and IT.
  aspect: '4:3'
  anchor_heading: 7. How the finance job changes
  placement: after-first-paragraph
