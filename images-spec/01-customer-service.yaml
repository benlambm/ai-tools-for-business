chapter: 01-customer-service
hero:
  slug: hero
  prompt: A small customer support team at curved workstations in a calm office, three simplified
    figures focused on monitors showing abstract chat-bubble and ticket shapes only, soft
    ambient lighting, wide establishing view.
  alt: Three support representatives at curved desks looking at screens displaying abstract
    chat-bubble icons in a calm office environment.
  caption: "Customer service and IT support are full of language work \u2014 the kind of work\
    \ AI tools can assist with."
  aspect: '16:9'
  placement: after-title
figures:
